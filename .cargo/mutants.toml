# cargo-mutants configuration.
#
# The sweep covers the soundness-critical core crate and the membership walk.
#
# The walk is where membership is decided, so it and the context it carries are
# the binding's files whose arms are worth a mutation number rather than a line
# count. Both are reachable from
# `cargo test` because the `interpreter-tests` feature links an embedded Python
# and `check/walk.rs`'s own corpus drives real values through `member`; the sweep
# is run with that feature (see the workflow) or every mutant reads as unviable.
#
# Every other binding file is exercised by pytest, which this harness cannot
# observe, so its mutants would all "survive" and say nothing about the tests.
# Each is excluded by name rather than by a crate-wide glob, so a new file joins
# the sweep by default instead of silently inheriting an exclusion — and
# `tests/test_mutation_scope.py` holds this list to the tree in both directions.
exclude_globs = [
    "crates/valgebra-py/examples/**",
    "crates/valgebra-py/src/build.rs",
    "crates/valgebra-py/src/check.rs",
    "crates/valgebra-py/src/exception.rs",
    "crates/valgebra-py/src/validator.rs",
    "crates/valgebra-py/src/check/index.rs",
    "crates/valgebra-py/src/check/violation.rs",
    "crates/valgebra-py/src/errors.rs",
    "crates/valgebra-py/src/input.rs",
    "crates/valgebra-py/src/lib.rs",
    "crates/valgebra-py/src/render.rs",
]

# has_disjoint_complement_pair is redundant with the covers_universe region check
# in finish_union, so its mutants are equivalent — they cannot change any result.
# Two schemas being disjoint forces their complements' region sets to together
# cover every region, so covers_universe already returns true whenever this helper
# would; a value only leaves both complements by belonging to both inners, which
# an empty intersection has none of. Excluding an unkillable equivalent mutant
# keeps the sweep honest rather than chasing a target no test can hit.
#
# Every entry below names a mutant `cargo mutants --list` really offers, which
# `tests/test_mutation_scope.py` checks: a regex matching nothing is a hole in
# the coverage claim that argues for a target that no longer exists.
exclude_re = [
    "has_disjoint_complement_pair",
    # The three `LeafRelations` defaults are read through call sites that
    # collapse `None` and `Some(false)` to the same answer: `leaf_subtype(..)
    # .unwrap_or(false)`, `no_int_between(..) == Some(true)`, and
    # `literals_disjoint(..).unwrap_or(false)`. Cannot-decide and decided-against
    # are the same conservative verdict there, which is the point of the
    # defaults, so no test can tell the two apart. The `Some(true)` mutant of each
    # IS killable and stays in the sweep: it turns a declined question into a
    # claim, which is the direction that would be unsound.
    "replace <impl LeafRelations for NoLeafRelations>::leaf_subtype -> Option<bool> with Some\\(false\\)",
    "replace LeafRelations::no_int_between -> Option<bool> with Some\\(false\\)",
    "replace LeafRelations::literals_disjoint -> Option<bool> with Some\\(false\\)",
    # The `Set`/`FrozenSet` arm of `empty_and_region` returns exactly what the
    # match's default returns. It is written out because the two answer the same
    # thing for OPPOSITE reasons -- a collection is known non-empty, the default
    # is non-empty only by conservatism -- and the source carries the
    # `match_same_arms` allow that says so. Deleting it cannot change a result.
    "delete match arm Schema::Set\\(_\\) \\| Schema::FrozenSet\\(_\\) in Schema::empty_and_region",
    # The walk's own interpreter-backed corpus lives in the file being swept, so
    # its helpers are mutated too. A mutation of a test helper says nothing about
    # the product's tests -- it makes the harness wrong, not the walk untested.
    "interpreter::",
]

# A few mutants run longer than the baseline; give generous headroom over it.
timeout_multiplier = 5.0
