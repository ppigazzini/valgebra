# cargo-mutants configuration.
#
# The sweep covers the soundness-critical core crate, the membership walk, and
# the frontend that builds a schema from an annotation.
#
# The walk is where membership is decided, the frontend is where an annotation
# becomes the set it denotes, and equality is where two schemas are judged one,
# so those are the binding's files whose arms are worth a mutation number rather
# than a line count. The frontend is four files -- the dispatch and the three
# surfaces beside it, `build/refine.rs`, `build/classes.rs` and
# `build/generics.rs` -- and all of them are reachable from `cargo test` because
# the `interpreter-tests` feature links an embedded Python and each carries its
# own corpus: `check/walk.rs` drives real values through `member`, and the
# frontend drives real annotations through `build_schema` and compares the
# render. The sweep is run with that feature (see the workflow) or every
# mutant reads as unviable.
#
# The sweep's verdict is the *embedded interpreter's*, and `ci.yml` pins CPython
# 3.12 for it: a mutant 3.14 reports as a survivor is one 3.12 kills, because the
# two answer a C accessor differently. Point `PYO3_PYTHON` at a 3.12 before
# running this by hand, or read a verdict that is about the interpreter --
# `docs/dev/07-tooling-ci.md` carries the whole invocation.
#
# The files excluded below are reached only through pytest, which *this* harness
# cannot observe: `cargo test` never loads the extension, so their mutants would
# all "survive" and say nothing about the tests.
#
# Excluded here and measured elsewhere. `.cargo/mutants-pytest.toml` examines
# exactly this set with a test command that builds the extension from the
# mutated copy and runs the Python suite against it, so a mutant one of them
# carries is caught by that suite or by nothing. The two configurations
# partition the binding, and `tests/test_pytest_sweep_scope.py` holds the
# partition in both directions: a file excused to pytest and examined nowhere
# fails, and so does one swept twice. Bringing a file into *this* sweep means
# writing it a Rust corpus first, and taking it out of that one.
#
# Each is excluded by name rather than by a crate-wide glob, so a new file joins
# the sweep by default instead of silently inheriting an exclusion — and
# `tests/test_mutation_scope.py` holds this list to the tree in both directions.
exclude_globs = [
    "crates/valgebra-py/examples/**",
    # A build script runs before the crate exists and decides how it is
    # compiled, so a mutation of it is not a change the test suite can observe:
    # every mutant either builds the same extension or none at all.
    "crates/valgebra-py/build.rs",
    "crates/valgebra-py/src/check.rs",
    "crates/valgebra-py/src/exception.rs",
    "crates/valgebra-py/src/validator.rs",
    "crates/valgebra-py/src/check/violation.rs",
    "crates/valgebra-py/src/errors.rs",
    "crates/valgebra-py/src/lib.rs",
    # The annotation render, whose answers are the snapshot corpus in pytest.
    # Named on its own line rather than grouped with the workload below, because
    # a file sharing another's reason is a file whose own reason nobody checks.
    # The survivors that corpus accepts are recorded in
    # `scripts/mutation_baseline_pytest.json`, each with the argument for it.
    "crates/valgebra-py/src/render.rs",
    # The instruction gate's own workload: a measuring instrument no caller
    # reaches and no suite runs, so a mutant of it is a mutant nothing can
    # observe. It is its own file for that reason -- held inside `lib.rs` its
    # lines count against the binding's coverage floor.
    "crates/valgebra-py/src/workload.rs",
]

# has_disjoint_complement_pair is redundant with the covers_universe region check
# in finish_union, so its mutants are equivalent — they cannot change any result.
# Two schemas being disjoint forces their complements' region sets to together
# cover every region, so covers_universe already returns true whenever this helper
# would; a value only leaves both complements by belonging to both inners, which
# an empty intersection has none of. Excluding an unkillable equivalent mutant
# keeps the sweep honest rather than chasing a target no test can hit.
#
# Every entry below names a mutant `cargo mutants --list` really offers, which
# `tests/test_mutation_scope.py` checks: a regex matching nothing excuses a
# target that does not exist, which reads as coverage and is not.
exclude_re = [
    "has_disjoint_complement_pair",
    # `snapshot_pays` chooses between two readings of a list of one scalar kind
    # -- the elements in place, or a snapshot of them read borrowed -- that test
    # the same elements against the same schema and report the same membership.
    # Every mutant of it moves cost and nothing else, which is the instruction
    # budget's business and not a test's, so none is killable by construction.
    # The two arms it chooses between are exercised either way: a list of
    # sixty-four elements takes the snapshot and a narrow one does not, and an
    # interpreter test asks both.
    "snapshot_pays",
    # The explain pass over a keyed map runs only where the map did not match.
    # Running it always reports nothing extra -- a value that matched has no
    # violation to find -- and in the fast mode the violations go to a buffer
    # nothing reads. Only the cost moves, and how much of it moves depends on
    # the machine: the mutant reads as caught on one runner and as surviving on
    # another, which is a target no baseline can hold steady.
    "replace && with \\|\\| in member",
    # An oracle default is unkillable only where *every* call site collapses
    # cannot-decide into the answer the mutant returns, and that is a claim
    # about the call sites rather than about the default: a question that grows
    # a site reading the other answer has a killable default, and belongs in the
    # sweep. `leaf_subtype` and `literals_disjoint` are both that case.
    #
    # `no_int_between` has one site, `== Some(true)`, so cannot-decide and
    # decided-against are one conservative verdict there and no test can tell
    # them apart. Its `Some(true)` mutant IS killable and stays in the sweep: it
    # turns a declined question into a claim, which is the unsound direction.
    #
    # `class_admits_kind` is the same argument with the polarity reversed. Its
    # one call site reads `== Some(false)`, because a class that cannot hold a
    # kind is the answer that refutes, so cannot-decide and *admits* collapse
    # there and `Some(true)` is the unkillable one. `Some(false)` stays in the
    # sweep, and is the unsound direction: it would refute every pair holding a
    # class no oracle reads.
    "replace LeafRelations::no_int_between -> Option<bool> with Some\\(false\\)",
    "replace LeafRelations::class_admits_kind -> Option<bool> with Some\\(true\\)",
    # The two questions about a class asked of a *direct* instance read their
    # `Some(false)` as the refutation, so `Some(true)` collapses into the
    # decline at their one call site each and is the unkillable one. Their
    # `Some(false)` stays in the sweep and is the unsound direction: it would
    # refute every class the oracle cannot read.
    "replace LeafRelations::direct_instance_of_kind -> Option<bool> with Some\\(true\\)",
    "replace LeafRelations::kind_derives_from -> Option<bool> with Some\\(true\\)",
    # The guard that lets a lone clause govern a parsed object's keys by its
    # value alone, read as always FALSE. Every object then takes the general
    # reading, which asks the clause about the key as well -- and for a clause
    # keyed by `str` or by anything that question is answered before it is asked,
    # because a parsed key is a string by construction. Same answers, one
    # `JsonValue` built and one schema walked per undeclared key, which is the
    # comparison gate's business (`json_document`) and not a test's.
    #
    # The other direction is a real defect and is killed rather than excused:
    # read as always true, a clause keyed by `int` -- which no parsed key can
    # satisfy -- would govern every key by its value alone and admit an object
    # nothing covers. The row is interpreter-backed deliberately: a row in pytest
    # is one this sweep cannot observe, and the nightly then reads the mutant as
    # new.
    "replace match guard matches!\\(clause.key, Schema::Str \\| Schema::Anything\\(_\\)\\) with false in undeclared_covered",
    # `Decided::resume_at` chooses where the explaining walk starts: at the
    # point the deciding walk stopped, or at the beginning. Both answer the same
    # thing -- every field before that point matched, so re-reading it reports
    # nothing -- so a mutant that always answers `(0, 0)`, or that reads the
    # entry-count guard as always false, makes the walk start over and changes
    # no report. What it changes is 36.8% of the explaining walk's instructions
    # (`scripts/perf_gate.py --binding-explain`), which is the instruction
    # gate's business and not a test's.
    #
    # The direction that IS killable stays in the sweep and is killed: resuming
    # where the walk did *not* stop. Reading the guard as always true resumes
    # into a value that has changed size, and
    # `a_value_that_changes_size_between_the_walks_is_not_resumed` fails;
    # resuming one field further skips the field that refused, and six rows
    # fail; carrying the wrong count skips the scan for undeclared keys, and the
    # row that asks one extra key and two fails.
    "replace Decided::resume_at -> \\(usize, usize\\) with \\(0, 0\\)",
    "replace match guard self.entries == entries with false in Decided::resume_at",
    # `SMALL_OBJECT` chooses between two readings of a parsed object's
    # undeclared keys -- covered where they lie, or collapsed to a table of last
    # values first -- that answer the same question and must answer it alike.
    # `a_parsed_object_reads_its_repeats_alike_at_every_width` asserts exactly
    # that, either side of the bound and across it, so flipping the comparison
    # sends every width down the other reading and changes no answer. Only the
    # cost moves, which is `scripts/compare_gate.py`'s business and not a
    # test's. The two readings themselves stay in the sweep and both of their
    # mutants die: the repeat test and the refusal are killable, and are killed.
    "replace <= with > in undeclared_covered",
    # The collection arm of `empty_and_region` returns exactly what the match's
    # default returns. It is written out because the two answer the same thing
    # for OPPOSITE reasons -- a collection is known non-empty, the default is
    # non-empty only by conservatism -- and the source carries the
    # `match_same_arms` allow that says so. Deleting it cannot change a result.
    "delete match arm Schema::Coll\\{..\\} in Schema::empty_and_region",
]

# A few mutants run longer than the baseline; give generous headroom over it.
# The number the lanes pass on the command line, which wins over this file:
# `tests/test_mutation_scope.py` holds the two equal, because a timeout counts as
# a survivor and a local sweep judging at a tighter multiple reports survivors
# about the machine rather than about the tests.
timeout_multiplier = 20.0
