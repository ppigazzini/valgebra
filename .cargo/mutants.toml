# cargo-mutants configuration.
#
# Mutation testing scopes to the soundness-critical core crate. Most of the
# binding crate's logic — the validation walk and error formatting — is exercised
# by the Python suite (pytest), not `cargo test`, so its mutants cannot be
# observed by this harness and would only add noise. The binding's pure helpers
# that now carry `cargo test` coverage (the interner, the index remap, the
# literal fast-path decision) share their source files with that pytest-only
# code, so a file- or crate-scoped sweep cannot isolate them; their correctness
# is instead measured by line coverage on the binding-coverage lane.
exclude_globs = ["crates/valgebra-py/**"]

# has_disjoint_complement_pair is redundant with the covers_universe region check
# in finish_union, so its mutants are equivalent — they cannot change any result.
# Two schemas being disjoint forces their complements' region sets to together
# cover every region, so covers_universe already returns true whenever this helper
# would; a value only leaves both complements by belonging to both inners, which
# an empty intersection has none of. Excluding an unkillable equivalent mutant
# keeps the sweep honest rather than chasing a target no test can hit.
#
# The guardedness check's structural arms are equivalent for one reason, proved
# as a property rather than argued here alone
# (`structural_constructors_absorb_the_guard`): `Guarded::Yes` is absorbing. The
# only arm of `occurs_unguarded` that can answer true demands `Guarded::No`, and
# the algebraic combinators pass `guarded` through unchanged, so nothing below a
# structural constructor is ever reported unguarded. Each structural arm
# therefore answers false for every input — exactly what the match's default
# answers — so deleting one cannot change a result, and neither can swapping the
# `||` between two operands that are both always false. `occurs_guarded` is the
# same statement one level down: it is `any_elem` over `occurs_unguarded(_,
# Guarded::Yes)`, so it too is constantly false.
#
# `SeqRegex::any_elem` stays in the sweep deliberately. Its mutants are
# equivalent only because `occurs_guarded` is its single caller, which is a fact
# about the call graph rather than about the argument above; a second caller
# would make the exclusion wrong without touching either function.
exclude_re = [
    "has_disjoint_complement_pair",
    "delete match arm Schema::Seq.* in Schema::occurs_unguarded",
    "delete match arm Schema::Set.* in Schema::occurs_unguarded",
    "delete match arm Schema::KeyedMap.* in Schema::occurs_unguarded",
    "delete match arm Schema::Attrs.* in Schema::occurs_unguarded",
    "replace \\|\\| with && in Schema::occurs_unguarded",
    "replace SeqRegex::occurs_guarded -> bool with false",
]

# A few mutants run longer than the baseline; give generous headroom over it.
timeout_multiplier = 5.0
