site_name: valgebra
site_description: Fast runtime validation through a closed Boolean algebra of schemas.
site_url: https://ppigazzini.github.io/valgebra/
repo_url: https://github.com/ppigazzini/valgebra
repo_name: ppigazzini/valgebra
copyright: Dual-licensed MIT OR Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: get-started/installation.md
      - Tutorial: get-started/tutorial.md
      - Quickstart: get-started/quickstart.md
      - Recipes: get-started/recipes.md
  - Guides:
      - Schema language: guides/schema-language.md
      - The Boolean algebra: guides/algebra.md
      - Refinements: guides/refinements.md
      - Recursive schemas: guides/recursion.md
      - JSON input: guides/json.md
      - Error model: guides/error-model.md
      - Inspecting a codebase: guides/inspection.md
      - Resource limits: guides/limits.md
      - Performance: guides/performance.md
      - Static checkers: guides/static-checking.md
  - Release notes: changelog.md
  - Explanation:
      - Foundations: explanation/foundations.md
      - Soundness argument: explanation/soundness.md
      - Decidability boundary: explanation/decidability.md
      - What it cannot do: explanation/boundaries.md
      - Several value universes: explanation/universes.md
  - Reference:
      - API reference: reference/api.md

# The developer set lives beside the user docs and is NOT published: it describes
# the codebase for a contributor and an agent reading it cold, which is a
# different subject from the user guide this site renders. Excluding it keeps
# --strict honest -- every remaining page is in the nav above.
exclude_docs: |
  dev/

# Every check the builder makes on a link and on the nav, raised to a warning so
# that --strict fails the build on it: a page or an anchor a link names that does
# not exist, a page under docs/ that no nav entry lists, and a link MkDocs cannot
# read as one to a page.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Include a file from outside docs/ verbatim, so the release notes the site
  # serves are the changelog the repository keeps rather than a second list
  # nothing holds to the first.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  # A page the site has served at another address answers there still: a page
  # that sends the reader on to where it lives now, with the anchor the link
  # named where the browser runs scripts. An entry stays as long as the site
  # does, since links to the old address do, the README of every release on
  # PyPI among them.
  - redirects:
      redirect_maps:
        00-installation.md: get-started/installation.md
        01-tutorial.md: get-started/tutorial.md
        02-quickstart.md: get-started/quickstart.md
        19-recipes.md: get-started/recipes.md
        03-schema-language.md: guides/schema-language.md
        04-algebra.md: guides/algebra.md
        05-refinements.md: guides/refinements.md
        06-recursion.md: guides/recursion.md
        07-json.md: guides/json.md
        08-error-model.md: guides/error-model.md
        09-inspection.md: guides/inspection.md
        10-limits.md: guides/limits.md
        11-performance.md: guides/performance.md
        18-static-checking.md: guides/static-checking.md
        12-changelog.md: changelog.md
        13-foundations.md: explanation/foundations.md
        14-soundness.md: explanation/soundness.md
        15-decidability.md: explanation/decidability.md
        17-boundaries.md: explanation/boundaries.md
        20-universes.md: explanation/universes.md
        16-api.md: reference/api.md
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            # The compiled module's classes, inspected where they are defined;
            # the script says why griffe reads them as aliases on its own.
            extensions:
              - scripts/docs_stubs.py:InspectTheCompiledClasses
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            # Hide dunder and private members; the public API has none.
            filters: ["!^_"]
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  # Machine-readable view of the site: /llms.txt (curated manifest, mirrors the
  # Diataxis nav) and /llms-full.txt (full content). Runs last so it captures the
  # mkdocstrings-generated API reference from the rendered HTML.
  - llmstxt:
      markdown_description: >-
        Fast runtime validation through a closed Boolean algebra of schemas.
        A schema denotes a set of Python values; validation is membership,
        with no copy and no coercion. Schemas compile once into a Rust
        validator tree. Standard typing annotations are the primary notation;
        union, intersection, complement, refinement, and fixpoints compose
        them into a law-tested lattice.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md: What valgebra is, how it is positioned, and where to start.
          - get-started/installation.md: Install the package and its build toolchain.
          - get-started/tutorial.md: Guided learning path from a scalar schema to an inspected failure.
          - get-started/quickstart.md: Condensed feature tour for readers who know the domain.
          - get-started/recipes.md: Tasks done end to end -- a response in a test, a value whose type a checker does not know, a schema against its last version, stored data against a new schema, a configuration file, a model's tool call, a response from an API the code does not own, a field of a FastAPI request, a message routed by its shape.
        Guides:
          - guides/schema-language.md: Every schema form with its denotation as a set of Python values.
          - guides/algebra.md: The Boolean lattice (union, intersection, complement), the normal form construction builds, and the recipes derived from them.
          - guides/refinements.md: Constraints and predicate refinements over a base schema.
          - guides/recursion.md: The recursive fixpoint for self-referential schemas.
          - guides/json.md: Parsing and validating JSON on the Rust path.
          - guides/error-model.md: Exception type, error codes, and the violation path format.
          - guides/inspection.md: Using valgebra to interrogate a codebase that has no schemas of its own.
          - guides/limits.md: Resource limits and the bounds the validator enforces.
          - guides/performance.md: Measured benchmarks, datasets, and compared versions.
          - guides/static-checking.md: What ty, mypy and pyright read from a schema, the spellings they refuse, and the ruff settings a project that validates its own classes needs.
        Release notes:
          - changelog.md: Every released version, what it changed, and what to do on upgrade.
        Explanation:
          - explanation/foundations.md: The denotational frame and the sourced set-theoretic and lattice theory.
          - explanation/soundness.md: Why membership checking is sound on its own terms.
          - explanation/decidability.md: What subtyping, equivalence, and emptiness decide exactly versus conservatively.
          - explanation/boundaries.md: What a runtime validator cannot do, and why each boundary is where it is.
          - explanation/universes.md: JSON's and TOML's values, and arrays, as sets below the top, in one algebra with no vocabulary of their own.
        API reference:
          - reference/api.md: The full public surface, generated from the package docstrings.
