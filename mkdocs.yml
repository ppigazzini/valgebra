site_name: valgebra
site_description: Fast runtime validation through a closed Boolean algebra of schemas.
site_url: https://ppigazzini.github.io/valgebra/
repo_url: https://github.com/ppigazzini/valgebra
repo_name: ppigazzini/valgebra
copyright: Dual-licensed MIT OR Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: README.md
  - Getting started:
      - Installation: 00-installation.md
      - Tutorial: 01-tutorial.md
      - Quickstart: 02-quickstart.md
  - Guides:
      - Schema language: 03-schema-language.md
      - The Boolean algebra: 04-algebra.md
      - Refinements: 05-refinements.md
      - Recursive schemas: 06-recursion.md
      - JSON input: 07-json.md
      - Error model: 08-error-model.md
      - Inspecting a codebase: 09-inspection.md
      - Resource limits: 10-limits.md
      - Performance: 11-performance.md
  - Release notes: 12-changelog.md
  - Explanation:
      - Foundations: 13-foundations.md
      - Soundness argument: 14-soundness.md
      - Decidability boundary: 15-decidability.md
  - Reference:
      - API reference: 16-api.md

# The developer set lives beside the user docs and is NOT published: it describes
# the codebase for a contributor and an agent reading it cold, which is a
# different subject from the user guide this site renders. Excluding it keeps
# --strict honest -- every remaining page is in the nav above.
exclude_docs: |
  dev/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Include a file from outside docs/ verbatim, so the release notes the site
  # serves are the changelog the repository keeps rather than a second list
  # nothing holds to the first.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            # Hide dunder and private members; the public API has none.
            filters: ["!^_"]
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  # Machine-readable view of the site: /llms.txt (curated manifest, mirrors the
  # Diataxis nav) and /llms-full.txt (full content). Runs last so it captures the
  # mkdocstrings-generated API reference from the rendered HTML.
  - llmstxt:
      markdown_description: >-
        Fast runtime validation through a closed Boolean algebra of schemas.
        A schema denotes a set of Python values; validation is membership,
        with no copy and no coercion. Schemas compile once into a Rust
        validator tree. Standard typing annotations are the primary notation;
        union, intersection, complement, refinement, and fixpoints compose
        them into a law-tested lattice.
      full_output: llms-full.txt
      sections:
        Getting started:
          - README.md: Overview, positioning against pydantic and msgspec, and a first example.
          - 00-installation.md: Install the package and its build toolchain.
          - 01-tutorial.md: Guided learning path from a scalar schema to an inspected failure.
          - 02-quickstart.md: Condensed feature tour for readers who know the domain.
        Guides:
          - 03-schema-language.md: Every schema form with its denotation as a set of Python values.
          - 04-algebra.md: The Boolean lattice — union, intersection, complement — and the law-justified simplifier.
          - 05-refinements.md: Constraints and predicate refinements over a base schema.
          - 06-recursion.md: The recursive fixpoint for self-referential schemas.
          - 07-json.md: Parsing and validating JSON on the Rust path.
          - 08-error-model.md: Exception type, error codes, and the violation path format.
          - 09-inspection.md: Recipes for interrogating a codebase that has no schemas of its own.
          - 10-limits.md: Resource limits and the bounds the validator enforces.
          - 11-performance.md: Measured benchmarks, datasets, and compared versions.
        Explanation:
          - 13-foundations.md: The denotational frame and the sourced set-theoretic and lattice theory.
          - 14-soundness.md: Why membership checking is sound on its own terms.
          - 15-decidability.md: What subtyping, equivalence, and emptiness decide exactly versus conservatively.
        Release notes:
          - 12-changelog.md: Every released version, what it changed, and what to do on upgrade.
        API reference:
          - 16-api.md: The full public surface, generated from the package docstrings.
