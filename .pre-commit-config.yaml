# Pre-commit hooks for the valgebra workspace.
# Run on every commit; run the full set with: pre-commit run --all-files
# Keep hook revs in step with the pins in pyproject.toml.
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # The fuzz seed corpus is binary fuzzer input, not text: the whitespace and
      # newline fixers would corrupt the bytes the fuzzer replays.
      - id: end-of-file-fixer
        exclude: ^fuzz/seeds/
      - id: trailing-whitespace
        exclude: ^fuzz/seeds/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^fuzz/seeds/

  # Python lint + format (Rust extension is not needed for these).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock

  # Rust gates, run through the project toolchain so they match CI exactly.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # The library targets carry two restriction lints the default group does
      # not, so the hook above passes on code the merge gate refuses. Same
      # command as the CI step, so a panicking index or unwrap is caught here
      # rather than after the push; tests and benches use both legitimately and
      # stay out of scope.
      - id: cargo-clippy-restrictions
        name: cargo clippy (no panicking index or unwrap in the library)
        entry: >-
          cargo clippy --locked --lib --all-features --
          -D clippy::indexing_slicing -D clippy::unwrap_used
        language: system
        types: [rust]
        pass_filenames: false
      # The fuzz crate is a detached workspace, so the clippy hook above does not
      # reach it and a change to the core's public types compiles cleanly here
      # while breaking the fuzz lane. Checked, not clippy-linted: its own lane
      # lints it under the nightly it needs.
      # `ty` runs in the merge gate and in `scripts/gate.py`, neither of which a
      # commit passes through, so a type error in this repository's own gate
      # script reaches a push before anything reads it. It is a second of wall
      # clock and it reads the whole project, so it is asked where `ruff` is
      # asked rather than twenty minutes later.
      - id: ty-check
        name: ty type check
        entry: uv run --no-sync ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: docs-lint
        name: docs lint
        entry: python3 scripts/docs_lint.py
        language: system
        types: [markdown]
        pass_filenames: false
      - id: cargo-check-fuzz
        # `--all-targets`, because the fuzz crate carries its own tests and CI
        # runs them: a plain `check` compiles the library and leaves the test
        # target for the lane to discover.
        name: cargo check (detached fuzz workspace)
        entry: cargo check --manifest-path fuzz/Cargo.toml --all-targets
        language: system
        types: [rust]
        pass_filenames: false
