version: 2
# Every ecosystem waits seven days after a release before proposing it, so a
# version pulled or compromised in its first week never reaches a pull request;
# zizmor's `dependabot-cooldown` audit reads this.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    # PyO3 0.30.0 and 0.30.1 recurse dropping a reference in `register_decref`
    # under the reference-pool cfgs `.cargo/config.toml` sets, which
    # `a_validator_dropped_while_detached_leaks_its_pool` holds; a later 0.30
    # is proposed, and that test decides it. jiter 0.18 needs PyO3 0.30, so it
    # is held with them: lift it with PyO3's.
    ignore:
      - dependency-name: "pyo3"
        versions: ["0.30.0", "0.30.1"]
      - dependency-name: "pyo3-build-config"
        versions: ["0.30.0", "0.30.1"]
      - dependency-name: "jiter"
        versions: ["0.18.x"]

  # The fuzz workspace is a detached crate with its own lockfile (libfuzzer-sys,
  # arbitrary), outside the root workspace, so it needs its own registration or
  # it rots unmonitored.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The scan above reaches .github/workflows only, so the action SHA pinned
  # inside the local setup-uv wrapper needs its own registration or it rots
  # unmonitored -- the same reason the detached fuzz workspace has one.
  - package-ecosystem: github-actions
    directory: "/.github/actions/setup-uv"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      setup-uv:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
