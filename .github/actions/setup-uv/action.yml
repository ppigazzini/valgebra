name: Set up uv
description: Install the pinned uv, retrying once so a slow manifest cannot fail the job.

inputs:
  uv-version:
    description: >-
      The uv release every lane installs. Pinning it also settles the resolver
      each lane runs under, instead of whatever `latest` resolves to that
      morning. Dependabot bumps the action SHA below but not this pin: rotate it
      on the monthly maintenance pass, in step with the uv-pre-commit rev.
    required: false
    default: "0.13.1"
  python-version:
    description: >-
      Interpreter for uv to install and put on the path. Left empty, uv picks
      one itself.
    required: false
    default: ""
  enable-cache:
    description: Whether uv's download cache is restored and saved across runs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # setup-uv reads its version manifest from raw.githubusercontent.com under a
    # hard five-second timeout and never retries, so a slow response there does
    # not slow the job down -- it fails it, on one lane while every other lane
    # in the same run installs uv fine. A second attempt turns that failure
    # back into the delay it should be. The first attempt is allowed to fail,
    # so keep its `with` block and the retry's identical: the retry is the same
    # install, not a fallback to some laxer one.
    # A lane names a release, and uv takes a runner image's own interpreter for
    # it where the image has one, so left to it a "3.12" lane runs Ubuntu's
    # 3.12.3, patch releases behind, while a lane naming a release the image
    # lacks runs uv's build of the newest patch. Every lane takes uv's build,
    # which the uv version pinned above fixes.
    - name: Take uv's interpreter rather than the image's
      shell: bash
      run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
    - id: install
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      continue-on-error: true
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
    - name: Retry the uv install
      if: steps.install.outcome == 'failure'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
