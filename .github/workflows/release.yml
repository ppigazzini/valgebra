name: Release

# Build the wheel matrix and the sdist, and publish them to a package index.
# Publishing happens only on a manual dispatch that selects a target index and
# confirms the version; no tag push can publish. Uploads use trusted publishing
# (OIDC, no stored token) and carry PEP 740 attestations. A dispatch with the
# target left at "none" builds the artifacts without publishing, for a dry run.
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Index to publish to; none builds artifacts only"
        type: choice
        options: [none, testpypi, pypi]
        default: none
      confirm_version:
        description: "Exact version to publish (must match the built wheels)"
        type: string
        default: ""
      attach_github_release:
        description: "Attach the built wheels to a GitHub pre-release for off-index installs"
        type: boolean
        default: false

# Serialize releases: never let two dispatches build or publish at once, and
# never cancel a run mid-publish (a half-finished upload is worse than a wait).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheels (${{ matrix.platform.runner }} ${{ matrix.platform.target }} ${{ matrix.platform.manylinux || matrix.platform.variant || 'native' }})
    runs-on: ${{ matrix.platform.runner }}
    # Twice the slowest row's reading, rounded up, as a sweep shard's ceiling
    # is twice its slowest shard's: the macOS x86_64 row builds seven
    # interpreters with a profile each on a four-core Intel VM, and its slowest
    # reading is 54 minutes. A row that reaches the ceiling is canceled with the
    # release waiting on it.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        # `pgo: true` adds profile-guided optimization on top of the release
        # profile. What it buys is **per shape and not one number**: measured on
        # one box against a plain release build of the same source, a large
        # homogeneous list and the JSON document come out ahead and the
        # fifty-field record walk comes out behind.
        #
        # It stays on, and that is a decision about a trade rather than a
        # default nobody revisited. Two of the three shapes gain more than the
        # third loses -- the list by about a third, the document by about a
        # fifth, the record walk behind by about a fifth -- and the two that
        # gain are the ones whose cost grows with the caller's data, where the
        # record walk's is fixed at its field count. A caller for whom the
        # record walk is the shape that matters builds their own plain wheel,
        # and `docs/11-performance.md` carries the two commands and the numbers.
        # The `pgo compare` lane in `ci.yml` reads it as close to where it is
        # applied as a lane gets: both wheels from one source, every shape, on
        # both bench interpreters, on dispatch. The figures stay on the page and
        # not in this file, because a matrix entry carrying them would read as a
        # setting rather than as the reading it is.
        # Recording a profile means *running* the instrumented build, so PGO
        # applies only where the build host executes its own output: the glibc
        # Linux (x86_64 and aarch64), macOS, and Windows x64 runners. Two
        # targets ship a plain (non-profiled) release build instead, with the
        # same platform compatibility: the Windows arm64 wheel, whose
        # instrumentation profile fails to merge on that toolchain, and the
        # musllinux wheels, which cross-build in a glibc container that cannot
        # run a musl-linked extension to train a profile. Native musl PGO is
        # possible in an Alpine container but is deliberately out of scope,
        # matching the reference build toolchain.
        #
        # PyPy is a third: a plain build in a row of its own, because a profiled
        # extension crashes there. PyPy's C-API layer sizes a native stack budget
        # from `sys.getrecursionlimit()`, the profile's inlining grows the walk's
        # frames, and on a value nested to the walk's own depth bound the budget
        # runs out first: a call that layer assumes cannot fail then does, and
        # the process dies with SIGSEGV where the plain build reports
        # `recursion_limit`, and the same source built plain passes the whole
        # suite. The Linux rows therefore name the CPython interpreters rather
        # than finding every one the image has, and the smoke runs the suite on
        # the PyPy wheel that ships.
        #
        # One PyPy wheel per series PyPy 8.0 implements, 3.11 and 3.12, for each
        # architecture. An installer matches the `pp80` ABI tag exactly, so PyPy
        # 7.3 installs from the source distribution. PyPy 8.0's binaries need
        # glibc 2.27, so the image that carries it is manylinux_2_28, where each
        # series sits at `/opt/python/pp3N-pypy3N_pp80` beside a 7.3 that
        # `pypy3.11` names. The row names the paths, and an image without one
        # fails the build rather than shipping another ABI under this row's
        # name. Each wheel is smoked on its own series, and
        # `tests/test_release_matrix.py` holds the series to the `pypy` lane's
        # legs and the rows to that ABI.
        platform:
          - { runner: ubuntu-26.04, target: x86_64, pgo: true, interpreter: python3.11 python3.12 python3.13 python3.14 python3.15 python3.14t python3.15t }
          - { runner: ubuntu-26.04-arm, target: aarch64, pgo: true, interpreter: python3.11 python3.12 python3.13 python3.14 python3.15 python3.14t python3.15t }
          - { runner: ubuntu-26.04, target: x86_64, manylinux: 2_28, interpreter: /opt/python/pp311-pypy311_pp80/bin/python /opt/python/pp312-pypy312_pp80/bin/python, variant: pypy80 }
          - { runner: ubuntu-26.04-arm, target: aarch64, manylinux: 2_28, interpreter: /opt/python/pp311-pypy311_pp80/bin/python /opt/python/pp312-pypy312_pp80/bin/python, variant: pypy80 }
          - { runner: ubuntu-26.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-26.04, target: aarch64, manylinux: musllinux_1_2 }
          # The arm64 row builds on macos-26, the newest macOS GitHub hosts. The
          # x86_64 row builds on macos-15-intel, as CPython's CI does
          # (python/cpython#148038): macos-26-intel carries an unresolved stall
          # (actions/runner-images#13882) that fails this row.
          #
          # On a host runner `--find-interpreter` builds for what the image
          # carries, and an image's tool cache is not the supported set.
          # `pythons` installs every supported interpreter first. Windows takes
          # its free-threaded builds in a job of their own, because
          # co-installing a release and its free-threaded build in one setup
          # step can fail there (maturin-action's README, python/cpython#127294),
          # and that job builds the interpreters by name. Windows arm64 installs
          # 3.12 onward.
          - { runner: macos-15-intel, target: x86_64, pgo: true, pythons: "3.11\n3.12\n3.13\n3.14\n3.15\n3.14t\n3.15t" }
          - { runner: macos-26, target: aarch64, pgo: true, pythons: "3.11\n3.12\n3.13\n3.14\n3.15\n3.14t\n3.15t" }
          - { runner: windows-2025-vs2026, target: x64, pgo: true, pythons: "3.11\n3.12\n3.13\n3.14\n3.15" }
          - { runner: windows-2025-vs2026, target: x64, pgo: true, pythons: "3.14t\n3.15t", interpreter: python3.14t python3.15t, variant: freethreaded }
          - { runner: windows-11-vs2026-arm, target: aarch64, pythons: "3.12\n3.13\n3.14\n3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PGO merges profiles with llvm-profdata, from the llvm-tools component.
      # On the host-built targets (macOS, Windows) add it to the host toolchain;
      # the Linux builds add it inside the manylinux container via
      # before-script-linux below.
      - if: ${{ matrix.platform.pgo && runner.os != 'Linux' }}
        run: rustup component add llvm-tools
      # `allow-prereleases` lets `3.15` resolve to its release candidate until
      # 3.15.0 is published and to the release after: the ABI is fixed from the
      # first candidate, so the wheel is the one the final release loads.
      - if: ${{ matrix.platform.pythons }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.platform.pythons }}
          allow-prereleases: true
      # On macOS a free-threaded install answers to `python3.14` as well as
      # `python3.14t`, and the one installed last is first on `PATH`, so
      # `--find-interpreter` can find the free-threaded build under the
      # release's name and build `cp314t` and `cp315t` with no `cp314` or
      # `cp315` beside them. So each interpreter is found where `setup-python`
      # records it, in the tool cache under the runner's architecture -- some
      # releases install as a framework and some as a plain build, and the tool
      # cache holds both -- and asked whether it is the build it is named for.
      - name: Name the interpreters
        id: interpreters
        if: ${{ matrix.platform.pythons && runner.os == 'macOS' }}
        shell: bash
        env:
          PYTHONS: ${{ matrix.platform.pythons }}
        run: |
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          named=""
          for version in $PYTHONS; do
            case "$version" in
              *t) minor="${version%t}"; want=1 ;;
              *) minor="$version"; want=0 ;;
            esac
            exe=""
            for candidate in \
              "$RUNNER_TOOL_CACHE"/Python/"$minor".*/"$arch"*/bin/python"$minor"t \
              "$RUNNER_TOOL_CACHE"/Python/"$minor".*/"$arch"*/bin/python"$minor"; do
              [ -x "$candidate" ] || continue
              got="$("$candidate" -c 'import sysconfig; print(sysconfig.get_config_var("Py_GIL_DISABLED") or 0)')"
              if [ "$got" = "$want" ]; then
                exe="$candidate"
                break
              fi
            done
            if [ -z "$exe" ]; then
              echo "::error::no $version build for $arch in the tool cache"
              exit 1
            fi
            named="$named $exe"
          done
          echo "list=${named# }" >> "$GITHUB_OUTPUT"
      # The action pulls its container itself, once, with no retry, so a registry
      # answering `504` fails a release dispatch that has nothing wrong with it --
      # and a dispatch is a person at a button rather than a push that reruns
      # itself. `ci.yml` pre-pulls for the same reason; this is the lane where it
      # matters more.
      #
      # The image is written out per target and policy, as the action's own
      # table (`DEFAULT_CONTAINERS` in its `src/index.ts`) names it for the host
      # each row runs on: the musl rows build in its cross image on an x86_64
      # host, and the `2_28` rows in the pypa image of that policy. It is not
      # derived from what `manylinux:` resolves to, as it is there: a name the
      # action resolves differently pulls something unused and the build is
      # unaffected, so a wrong guess costs a pause and never a wheel. A pull that succeeds leaves
      # the image in the daemon and the action's own pull is a no-op; one that
      # does not still lets the action try, because this step exists to make the
      # lane sturdier and not to become a new way for it to fail.
      - name: Pull the build container, with retries
        if: ${{ runner.os == 'Linux' }}
        env:
          POLICY: ${{ matrix.platform.manylinux || 'manylinux2014' }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          case "$POLICY" in
            2_28)          image="quay.io/pypa/manylinux_2_28_${TARGET}:latest" ;;
            musllinux_1_2) image="ghcr.io/rust-cross/rust-musl-cross:${TARGET}-musl" ;;
            *)             image="quay.io/pypa/manylinux2014_${TARGET}:latest" ;;
          esac
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              exit 0
            fi
            echo "pull attempt $attempt failed"
            sleep 15
          done
          echo "::warning::could not pre-pull $image; the build step will try"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          # The version `uv.lock` resolves, so a release builds with the maturin
          # the lanes tested rather than whichever is newest on the day.
          maturin-version: "1.16.0"
          target: ${{ matrix.platform.target }}
          # --find-interpreter builds for every interpreter the image exposes
          # that satisfies requires-python: each CPython and the free-threaded
          # build where present (see docs/00-installation.md, which names what
          # ships). The Linux, macOS and Windows free-threaded rows name theirs
          # instead, the Linux ones so that PyPy is built in its own plain row.
          # --pgo (native targets only) runs the training workload configured
          # in pyproject.toml against the instrumented build.
          args: >-
            --release --out dist
            ${{ steps.interpreters.outputs.list && format('--interpreter {0}', steps.interpreters.outputs.list) || matrix.platform.interpreter && format('--interpreter {0}', matrix.platform.interpreter) || '--find-interpreter' }}
            ${{ matrix.platform.pgo && '--pgo' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # llvm-tools inside the manylinux container for the PGO profile merge.
          before-script-linux: ${{ matrix.platform.pgo && 'rustup component add llvm-tools' || '' }}
          # A released wheel must never trust a cached compile.
          sccache: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.variant || matrix.platform.manylinux || 'native' }}
          # A musllinux row builds every interpreter its image carries, PyPy among
          # them, and neither Docker's images nor uv's download list holds a musl
          # PyPy to load the wheel. A wheel nothing loads does not ship, so the
          # upload leaves those out, and the musl smoke refuses one that reaches
          # its set. An exclusion leaves the artifact's root at `dist`.
          path: |
            dist
            !dist/*-pp3*-*musllinux*.whl
          # An empty upload must fail here rather than downstream: the smoke job
          # installs "the matching wheel from the downloaded set", and a set with
          # no wheel in it is the one shape that check cannot report on.
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: "1.16.0"
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.wheel.name }}
    needs: [wheels]
    # Install each built wheel on its own platform, import it and run the product
    # suite on it before anything is published. A wheel that compiles and fails to
    # load (the "init function of _valgebra returned uninitialized object" class
    # of failure) fails the import; a profiled build that crashes only at the
    # walk's depth bound, which no import reaches, fails the suite. The lanes run
    # the suite on a wheel they build themselves, never on the one that ships.
    strategy:
      fail-fast: false
      matrix:
        wheel:
          # `pythons` are the interpreters each wheel set runs the product suite
          # on: the floor, the newest release and the free-threaded builds, where
          # the set carries a wheel for them. `imports` are the releases between,
          # whose wheels are installed, imported, checked and run through the
          # bounds file: each is a build of its own, profiled on its own
          # interpreter, and a release with none of its wheels loaded ships a
          # build nothing ran.
          - { name: linux-x86_64, runner: ubuntu-26.04, artifact: wheels-ubuntu-26.04-x86_64-native, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
          - { name: linux-aarch64, runner: ubuntu-26.04-arm, artifact: wheels-ubuntu-26.04-arm-aarch64-native, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
          # Each PyPy wheel is smoked on its own series, the newest the pinned uv
          # carries, which is PyPy 8.0 on both.
          - { name: linux-x86_64-pypy80, runner: ubuntu-26.04, artifact: wheels-ubuntu-26.04-x86_64-pypy80, pythons: "pypy@3.11 pypy@3.12" }
          - { name: linux-aarch64-pypy80, runner: ubuntu-26.04-arm, artifact: wheels-ubuntu-26.04-arm-aarch64-pypy80, pythons: "pypy@3.11 pypy@3.12" }
          - { name: macos-x86_64, runner: macos-15-intel, artifact: wheels-macos-15-intel-x86_64-native, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
          - { name: macos-arm64, runner: macos-26, artifact: wheels-macos-26-aarch64-native, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
          - { name: windows-x64, runner: windows-2025-vs2026, artifact: wheels-windows-2025-vs2026-x64-native, pythons: "3.11 3.15", imports: "3.12 3.13 3.14" }
          - { name: windows-x64-freethreaded, runner: windows-2025-vs2026, artifact: wheels-windows-2025-vs2026-x64-freethreaded, pythons: "3.14t 3.15t" }
          - { name: windows-arm64, runner: windows-11-vs2026-arm, artifact: wheels-windows-11-vs2026-arm-aarch64-native, pythons: "3.12 3.15", imports: "3.13 3.14", host: "3.12\n3.13\n3.14\n3.15" }
    runs-on: ${{ matrix.wheel.runner }}
    timeout-minutes: 45
    # The musllinux wheels are smoked in `smoke-musl`, in Alpine containers: a
    # musl wheel loads only on a musl interpreter. The glibc Linux, macOS, and
    # Windows wheels -- the platforms with no other functional coverage -- are
    # all exercised below.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel.artifact }}
          path: dist
      # Not the local ./.github/actions/setup-uv wrapper the CI lanes use: this
      # job installs uv before the repository is on disk -- its checkout comes
      # later, into `tree/`, for the suite alone -- so the wrapper's own files are
      # not there to run from.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          # This job installs from a downloaded artifact, not a checked-out
          # dependency file, so there is nothing for the uv cache to key on.
          enable-cache: false
      # uv's own build of a release candidate can exist for x64 alone, which
      # Windows on arm64 runs emulated and which loads no arm64 wheel: the arm64
      # set is imported on the interpreters setup-python installs for the
      # runner's own architecture, and uv is held to those.
      - if: ${{ matrix.wheel.host }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.wheel.host }}
          allow-prereleases: true
      - name: Install the built wheel and import it
        # A venv per interpreter, the matching wheel from the downloaded set with
        # no index, then an import validated across the object and JSON paths,
        # with every warning an error: an import that warns fails. On a
        # free-threaded interpreter the import must leave the GIL off.
        shell: bash
        env:
          PYTHONS: ${{ matrix.wheel.pythons }} ${{ matrix.wheel.imports }}
          UV_PYTHON_PREFERENCE: ${{ matrix.wheel.host && 'only-system' || 'managed' }}
        run: |
          for py in $PYTHONS; do
            uv venv --python "$py" ".venv-$py"
            uv pip install --python ".venv-$py" --no-index --find-links dist valgebra
            bin=".venv-$py/bin"; [ -d "$bin" ] || bin=".venv-$py/Scripts"
            "$bin/python" -W error -c "import sys, sysconfig, valgebra as v; assert v.Validator(int).is_valid(1); assert not v.Validator(int).is_valid('x'); assert v.Validator(list[int]).is_valid([1, 2]); assert v.Validator(int).is_valid_json('1'); assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled()); print('smoke ok', sys.version.split()[0], v.__version__)"
          done
      # The checkout is for the suite alone: `tests/`, and the pages and IR a few
      # product tests hold the wheel to. The package under test is the wheel
      # from `dist`, never the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tree
      - name: Run the product suite on the built wheel
        shell: bash
        env:
          PYTHONS: ${{ matrix.wheel.pythons }}
          IMPORTS: ${{ matrix.wheel.imports }}
          HYPOTHESIS_PROFILE: ci
        run: |
          # The `test` group at the versions the lock holds, as the PyPy lane
          # installs it: a release on the index fails no release until the
          # lock takes it.
          uv export --project tree --locked --only-group test --no-emit-project \
            -o suite.txt
          for py in $PYTHONS; do
            uv pip install --python ".venv-$py" -r suite.txt
            bin=".venv-$py/bin"; [ -d "$bin" ] || bin=".venv-$py/Scripts"
            "$bin/python" -m pytest -q -m "not repository" tree/tests
          done
          # The releases between run the bounds file: each wheel is profiled on
          # its own interpreter and lays out frames of its own, so the stack
          # the deepest walk takes on one wheel is no reading of another's.
          for py in $IMPORTS; do
            uv pip install --python ".venv-$py" -r suite.txt
            bin=".venv-$py/bin"; [ -d "$bin" ] || bin=".venv-$py/Scripts"
            "$bin/python" -m pytest -q -m "not repository" tree/tests/test_adversarial_bounds.py
          done

  smoke-musl:
    name: smoke ${{ matrix.wheel.name }}
    needs: [wheels]
    # The musllinux wheels, each on the musl CPython of its release in the
    # Alpine image the Docker library publishes as `python:<release>-alpine`:
    # the product suite on the floor, the newest release and the free-threaded
    # builds, an import, the one check and the bounds file on the releases
    # between, as the glibc rows do. The Docker library publishes no free-threaded
    # image, so a free-threaded wheel runs in plain Alpine on uv's musl build of
    # its release, mounted into the container. The aarch64 set, cross-built on an
    # x86_64 runner, runs on an arm64 one. The build row names no interpreter --
    # the image builds every one it carries -- so the set is read off the
    # artifact, and a wheel no container loaded fails the smoke.
    strategy:
      fail-fast: false
      matrix:
        wheel:
          - { name: linux-x86_64-musl, runner: ubuntu-26.04, artifact: wheels-ubuntu-26.04-x86_64-musllinux_1_2, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
          - { name: linux-aarch64-musl, runner: ubuntu-26.04-arm, artifact: wheels-ubuntu-26.04-aarch64-musllinux_1_2, pythons: "3.11 3.15 3.14t 3.15t", imports: "3.12 3.13 3.14" }
    runs-on: ${{ matrix.wheel.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel.artifact }}
          path: dist
      # The checkout is for the suite alone, as in the glibc smoke.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tree
      # For the export of the suite's packages from the lock alone: the
      # containers install with their own pip. The upstream action, for the
      # reason the glibc smoke gives.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      # A free-threaded release has no Docker image, and uv's musl build of it
      # runs in plain Alpine. `image.sh` names what a release's container runs
      # from, for the two steps below: the release's image, or Alpine with that
      # build mounted and first on the path. uv marks its builds externally
      # managed, and the container is thrown away with what it installs, so pip
      # is told to install anyway. Its launcher asks `realpath --`, which
      # BusyBox refuses, so both steps run `python -m pip`.
      - name: Install the free-threaded musl interpreters
        shell: bash
        env:
          PYTHONS: ${{ matrix.wheel.pythons }}
        run: |
          for py in $PYTHONS; do
            case "$py" in *t) ;; *) continue ;; esac
            uv python install --no-bin --install-dir "$PWD/musl-$py" \
              "cpython-${py%t}+freethreaded-linux-$(uname -m)-musl"
          done
          cat > image.sh <<'SH'
          image_of() {
            case "$1" in
              *t)
                home=$(readlink -f "musl-$1/cpython-${1%t}+freethreaded-linux-$(uname -m)-musl")
                image=(-v "$home:/python" -e PATH=/python/bin:/usr/sbin:/usr/bin:/sbin:/bin -e PIP_BREAK_SYSTEM_PACKAGES=1 alpine:3.24)
                ;;
              *) image=("python:$1-alpine") ;;
            esac
          }
          SH
      # The same install and check as the glibc rows, in a script each
      # container runs: the container's own pip, the matching wheel from the
      # downloaded set with no index, and an import with every warning an
      # error, required on a free-threaded interpreter to leave the GIL off.
      - name: Install the musl wheel in its container and import it
        shell: bash
        env:
          PYTHONS: ${{ matrix.wheel.pythons }} ${{ matrix.wheel.imports }}
        run: |
          . ./image.sh
          cat > import.sh <<'SH'
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore --no-index --find-links /dist valgebra
          python -W error -c "import sys, sysconfig, valgebra as v; assert v.Validator(int).is_valid(1); assert not v.Validator(int).is_valid('x'); assert v.Validator(list[int]).is_valid([1, 2]); assert v.Validator(int).is_valid_json('1'); assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled()); print('smoke ok', sys.version.split()[0], v.__version__)"
          SH
          for py in $PYTHONS; do
            image_of "$py"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/import.sh:/import.sh:ro" \
              "${image[@]}" sh -e /import.sh
          done
      # Each wheel's ABI tag is a release a container above loaded. A wheel the
      # image starts building -- a new release, a new build of one -- fails here
      # until a row loads it.
      - name: Every wheel the set holds is loaded
        shell: bash
        env:
          LOADED: ${{ matrix.wheel.pythons }} ${{ matrix.wheel.imports }}
        run: |
          status=0
          for wheel in dist/*.whl; do
            abi=$(basename "$wheel" .whl | cut -d- -f4)
            accounted=no
            for release in $LOADED; do
              if [ "$abi" = "cp${release/./}" ]; then accounted=yes; fi
            done
            if [ "$accounted" = no ]; then
              echo "::error::$(basename "$wheel") is built and loaded by no container"
              status=1
            fi
          done
          exit "$status"
      - name: Run the product suite on the musl wheel in its container
        shell: bash
        env:
          PYTHONS: ${{ matrix.wheel.pythons }}
          IMPORTS: ${{ matrix.wheel.imports }}
        run: |
          # The `test` group at the versions the lock holds, as the glibc smoke
          # installs it, exported here and read by each container's pip.
          uv export --project tree --locked --only-group test --no-emit-project \
            -o suite.txt
          . ./image.sh
          cat > suite.sh <<'SH'
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore --no-index --find-links /dist valgebra
          python -m pip install -q --disable-pip-version-check --root-user-action=ignore -r /suite.txt
          python -m pytest -q -p no:cacheprovider -m "not repository" "$SUITE"
          SH
          # The suite on the ends, and the bounds file on the releases between,
          # for the reason the glibc smoke gives.
          for py in $PYTHONS; do
            image_of "$py"
            docker run --rm -e HYPOTHESIS_PROFILE=ci -e SUITE=/tree/tests -w /tmp \
              -v "$PWD/dist:/dist:ro" -v "$PWD/tree:/tree:ro" -v "$PWD/suite.sh:/suite.sh:ro" \
              -v "$PWD/suite.txt:/suite.txt:ro" \
              "${image[@]}" sh -e /suite.sh
          done
          for py in $IMPORTS; do
            docker run --rm -e HYPOTHESIS_PROFILE=ci -e SUITE=/tree/tests/test_adversarial_bounds.py -w /tmp \
              -v "$PWD/dist:/dist:ro" -v "$PWD/tree:/tree:ro" -v "$PWD/suite.sh:/suite.sh:ro" \
              -v "$PWD/suite.txt:/suite.txt:ro" \
              "python:$py-alpine" sh -e /suite.sh
          done

  sdist-smoke:
    name: smoke sdist
    needs: [sdist]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The source distribution is the fallback install for any platform without a
    # wheel, so build it from source, import it and run the product suite on it
    # before it can publish: a broken manifest or a missing crate file fails here
    # rather than on a user's machine.
    steps:
      # Not the $/.github/actions/setup-rust wrapper the CI lanes use, for the
      # reason the uv install below gives: nothing is checked out yet. It runs
      # the same rustup command, which the runner carries.
      - name: Install the stable Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      # Not the local ./.github/actions/setup-uv wrapper the CI lanes use: this
      # job installs uv before the repository is on disk -- its checkout comes
      # later, into `tree/`, for the suite alone -- so the wrapper's own files are
      # not there to run from.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          # This job installs from a downloaded artifact, not a checked-out
          # dependency file, so there is nothing for the uv cache to key on.
          enable-cache: false
      - name: Build the sdist from source and import it
        # Install the exact built sdist file so it is compiled from source here;
        # the package index stays available only for the build backend, never for
        # valgebra itself, which comes from the local artifact.
        shell: bash
        run: |
          uv venv
          uv pip install dist/valgebra-*.tar.gz
          .venv/bin/python -W error -c "import valgebra as v; assert v.Validator(int).is_valid(1); assert not v.Validator(int).is_valid('x'); assert v.Validator(list[int]).is_valid([1, 2]); assert v.Validator(int).is_valid_json('1'); print('sdist smoke ok', v.__version__)"
      # As for the wheels: the checkout is for the suite alone, and the package
      # under test is the one built from the sdist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tree
      - name: Run the product suite on the build from source
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          # The `test` group at the versions the lock holds, as the wheel
          # smokes install it.
          uv export --project tree --locked --only-group test --no-emit-project \
            -o suite.txt
          uv pip install -r suite.txt
          .venv/bin/python -m pytest -q -m "not repository" tree/tests

  github-release:
    name: attach wheels to a github pre-release
    needs: [wheels, sdist, smoke, smoke-musl, sdist-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A dispatch can attach the built artifacts to a deletable GitHub
    # pre-release so the exact wheels install by their asset URL with no package
    # index. The pre-release tag is a build marker (build-<version>-<run>), not
    # a version tag, and triggers nothing: no workflow listens for tag pushes.
    if: ${{ inputs.attach_github_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Cut a pre-release carrying the built wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl 2>/dev/null | head -n1 || true)"
          if [ -z "$wheel" ]; then
            echo "::error::no wheels found in dist/"; exit 1
          fi
          version="$(basename "$wheel")"; version="${version#valgebra-}"; version="${version%%-*}"
          tag="build-${version}-${{ github.run_number }}"
          notes="Unofficial build of valgebra ${version} for off-index testing."
          notes="${notes} Install a wheel matching the target platform by its"
          notes="${notes} asset URL, e.g. uv pip install <asset-url>. Not"
          notes="${notes} published to any package index."
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "valgebra ${version} (build ${{ github.run_number }})" \
            --notes "$notes" \
            --prerelease

  publish:
    name: publish to ${{ inputs.publish_target }}
    # The wheel and sdist smoke must pass before anything publishes: a broken wheel fails
    # its import here and blocks the upload.
    needs: [wheels, sdist, smoke, smoke-musl, sdist-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Publishing requires a deliberate dispatch that selects a real index, from
    # the main branch: a dry-run dispatch (target "none") uploads nothing, no tag
    # reaches here, and a dispatch from a topic branch cannot publish a commit the
    # merge gate never blessed.
    if: ${{ inputs.publish_target != 'none' && github.ref == 'refs/heads/main' }}
    # The deployment environment that holds the trusted-publisher binding for
    # the selected index; create the pypi and testpypi environments in the
    # repository settings, with required reviewers, before the first release.
    environment:
      name: ${{ inputs.publish_target }}
      url: ${{ inputs.publish_target == 'pypi' && 'https://pypi.org/p/valgebra' || 'https://test.pypi.org/p/valgebra' }}
    permissions:
      # OIDC token for trusted publishing, and attestation signing for PEP 740.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Confirm the requested version matches the built artifacts
        # A publish must name the exact version it ships; an empty input or a
        # mismatch aborts before anything is uploaded. The dispatch input is read
        # through the environment, never expanded into the script text.
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl 2>/dev/null | head -n1 || true)"
          if [ -z "$wheel" ]; then
            echo "::error::no wheels found in dist/"; exit 1
          fi
          built="$(basename "$wheel")"; built="${built#valgebra-}"; built="${built%%-*}"
          echo "built artifacts are version $built"
          if [ -z "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version is required to publish"; exit 1
          fi
          if [ "$built" != "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version '$CONFIRM_VERSION' != built version '$built'"; exit 1
          fi
      - name: Refuse to publish a stale or already-published version
        # Fail closed. The baked-in version means an unbumped re-run must not slip
        # through, and a flaky index must not be read as "absent". Proceed only on
        # a definitive 404 (absent); a 200 (present) is a stale re-publish; any
        # other response (5xx/429/network) leaves it unconfirmed, so abort rather
        # than wave it through. Then also assert the version differs from the
        # index's current latest, so an ungated re-run cannot publish even on a
        # brief per-version inconsistency. The enclosing job already gates on the
        # target, so no step-level condition is needed here.
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          built="$(basename "$wheel")"; built="${built#valgebra-}"; built="${built%%-*}"
          base="${{ inputs.publish_target == 'testpypi' && 'https://test.pypi.org' || 'https://pypi.org' }}"
          # --retry-all-errors retries transient 5xx/429 and connection failures;
          # no --fail, so a 404 is read rather than collapsed into an exit code. A
          # persistent failure yields 000, handled as unconfirmed below.
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 \
            -o /dev/null -w '%{http_code}' "$base/pypi/valgebra/$built/json" || echo 000)"
          case "$code" in
            404) echo "version $built is absent from $base; proceeding" ;;
            200) echo "::error::version $built is already on $base; bump the version before publishing"; exit 1 ;;
            *) echo "::error::could not confirm version $built against $base (HTTP $code); refusing to publish"; exit 1 ;;
          esac
          # Belt and suspenders: refuse if the build matches the index's current
          # latest. A project absent from the index (first publish) yields no
          # latest, so this does not block the first release.
          latest="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 "$base/pypi/valgebra/json" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("info", {}).get("version", ""))' 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$built" = "$latest" ]; then
            echo "::error::version $built is already the latest release on $base; bump the version before publishing"
            exit 1
          fi
          echo "version $built differs from the latest on $base (${latest:-none}); proceeding"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # The selected index. Trusted publishing needs no token; attestations
          # are generated by default. skip-existing is off: the pre-publish check
          # already refuses a version on the index, so a duplicate upload is a
          # real error, not something to absorb into a green run.
          repository-url: ${{ inputs.publish_target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: false
